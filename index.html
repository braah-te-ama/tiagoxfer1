<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Gorila</title>
</head>
<body>
    
    <section class="header-section" id="header-section">

    <header class="header-pc" id="header-pc">
        <div class="izquierda-pc" id="izquierda-pc">
            <a href="#" class="Logo" id="Logo">Gorila</a>
        </div>
        <div class="derecha-pc" id="derecha-pc">
            <a href="#" class="opciones-derecha-pc" id="opciones-derecha-pc-opcion">eventos</a>
            <a href="#" class="opciones-derecha-pc" id="opciones-derecha-pc-opcion">nosotros</a>
            <a href="#" class="opciones-derecha-pc" id="opciones-derecha-pc-opcion">dumps</a>
            <a href="#" class="opciones-derecha-pc" id="opciones-derecha-pc-ubicacion">ubicacion</a>
        </div>
    </header>

    </section>

    <section class="inicio" id="inicio">
        <div class="inicio-div" id="inicio-div">
        <div class="degradado-inicio" id="degradado-inicio"></div>
        
        <div class="informacion" id="informacion">
            <div class="titulo-grupo" id="titulo-grupo">
            <p class="titulo-inicio" id="titulo-inicio">La noche de <br> la nostalgia </p>
            <p class="titulo-gorila" id="titulo-gorila">DJ Nino ● Sandombe Club</p>
            </div>
            <div class="botones-informacion" id="botones-informacion">
                <a href="#" class="comprar-entrada" id="comprar-entrada">Comprar entrada</a>
            </div>
            <div class="patrocinio" id="patrocinio">
                <img src="https://images-svetnapojov-cdn.rshop.sk/categoryImage/manufacturers/f18f6af5c4339e1cb880da8968166ae5.png" alt="" class="logo-patro" id="logo-patro">
                <img src="https://vectorseek.com/wp-content/uploads/2023/09/Zillertal-Logo-Vector.svg-.png" alt="" class="logo-patro" id="logo-patro">
                <img src="https://www.energiz.ar/_next/static/media/Baly-Logotipo_Principal-Amarillo.20ea8cc0.webp" alt="" class="logo-patro" id="logo-patro">
            </div>
        </div>

        </div>
    </section>

    <section class="eventos-disponibles" id="eventos-disponibles">
        <p class="titulo-eventos-disponibles" id="eventos-disponibles">Eventos disponibles <span class="flecha-span" id="flecha-span">></span></p>
    
        <div class="carrusel-contenedor" id="carrusel-contenedor">
            <div class="evento">
                <div class="degradado-evento" id="degradado-evento"></div>
                <div class="informacion-evento-comprar" id="informacion-evento-comprar">
                    <div class="informacion-evento">
                        <p class="titulo-evento">La noche de <br> la nostalgia </p>
                    </div>
                    <div class="botones-evento" id="botones-evento">
                        <a href="#" class="boton-comprar-evento" id="boton-comprar-evento">comprar</a>
                    </div>
                </div>
            </div>
        </div>

    </section>
</body>
</html>
